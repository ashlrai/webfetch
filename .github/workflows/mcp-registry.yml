name: MCP Registry

on:
  workflow_dispatch:
  push:
    # Only main publishes. Without this, any feature-branch push that touched
    # packages/mcp/package.json tried to publish to the public MCP registry.
    branches: [main]
    paths:
      - 'packages/mcp/package.json'
      - 'packages/mcp/server.json'
      - '.github/workflows/mcp-registry.yml'

jobs:
  publish:
    name: Validate and publish MCP registry metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Validate server.json
        run: ../../mcp-publisher validate
        working-directory: packages/mcp

      - name: Skip if this version is already in the registry
        id: exists
        working-directory: packages/mcp
        run: |
          name="$(jq -r .name server.json)"
          version="$(jq -r .version server.json)"
          code="$(curl -s -o /dev/null -w '%{http_code}' \
            "https://registry.modelcontextprotocol.io/v0.1/servers/${name//\//%2F}/versions/${version}")"
          echo "registry returned $code for $name@$version"
          if [ "$code" = "200" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$name@$version is already published; bump server.json version to publish again."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to MCP Registry
        if: steps.exists.outputs.published != 'true'
        run: ../../mcp-publisher login github-oidc
        working-directory: packages/mcp

      - name: Publish server
        if: steps.exists.outputs.published != 'true'
        run: ../../mcp-publisher publish
        working-directory: packages/mcp
